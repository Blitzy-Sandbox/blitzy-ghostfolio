<div class="dashboard-canvas">
  <div class="dashboard-canvas__toolbar">
    <button
      color="primary"
      mat-flat-button
      type="button"
      (click)="openCatalog()"
    >
      <ion-icon aria-hidden="true" name="add-outline"></ion-icon>
      <span i18n>Add module</span>
    </button>
  </div>

  @if (items.length === 0) {
    <div class="dashboard-canvas__empty-state" data-testid="empty-state">
      <ion-icon
        aria-hidden="true"
        class="dashboard-canvas__empty-icon"
        name="grid-outline"
      ></ion-icon>
      <p i18n>Your dashboard is empty. Add a module to get started.</p>
    </div>
  }

  <gridster class="dashboard-canvas__grid" [options]="options">
    @for (item of items; track item.moduleKey) {
      <gridster-item class="dashboard-canvas__item" [item]="item">
        <mat-card appearance="outlined" class="dashboard-module">
          <div class="dashboard-module__header">
            <ion-icon
              aria-hidden="true"
              class="dashboard-module__drag-handle"
              i18n-matTooltip
              matTooltip="Drag to move"
              name="reorder-two-outline"
            ></ion-icon>

            <span class="dashboard-module__title">{{
              getModuleName(item.moduleKey)
            }}</span>

            <button
              class="dashboard-module__menu-trigger"
              mat-icon-button
              type="button"
              [attr.aria-label]="getModuleName(item.moduleKey)"
              [matMenuTriggerFor]="moduleMenu"
            >
              <ion-icon
                aria-hidden="true"
                name="ellipsis-horizontal"
              ></ion-icon>
            </button>

            <mat-menu #moduleMenu="matMenu">
              <button
                data-testid="open-move-menu"
                mat-menu-item
                type="button"
                [matMenuTriggerFor]="moveMenu"
              >
                <ion-icon aria-hidden="true" name="move-outline"></ion-icon>
                <span i18n>Move</span>
              </button>
              <button
                data-testid="open-resize-menu"
                mat-menu-item
                type="button"
                [matMenuTriggerFor]="resizeMenu"
              >
                <ion-icon aria-hidden="true" name="resize-outline"></ion-icon>
                <span i18n>Resize</span>
              </button>
              <button
                data-testid="remove-module"
                mat-menu-item
                type="button"
                (click)="removeModule(item)"
              >
                <ion-icon aria-hidden="true" name="trash-outline"></ion-icon>
                <span i18n>Remove</span>
              </button>
            </mat-menu>

            <mat-menu #moveMenu="matMenu">
              <button
                data-testid="move-up"
                mat-menu-item
                type="button"
                (click)="moveModule(item, 0, -1)"
              >
                <ion-icon aria-hidden="true" name="arrow-up-outline"></ion-icon>
                <span i18n>Move up</span>
              </button>
              <button
                data-testid="move-down"
                mat-menu-item
                type="button"
                (click)="moveModule(item, 0, 1)"
              >
                <ion-icon
                  aria-hidden="true"
                  name="arrow-down-outline"
                ></ion-icon>
                <span i18n>Move down</span>
              </button>
              <button
                data-testid="move-left"
                mat-menu-item
                type="button"
                (click)="moveModule(item, -1, 0)"
              >
                <ion-icon
                  aria-hidden="true"
                  name="arrow-back-outline"
                ></ion-icon>
                <span i18n>Move left</span>
              </button>
              <button
                data-testid="move-right"
                mat-menu-item
                type="button"
                (click)="moveModule(item, 1, 0)"
              >
                <ion-icon
                  aria-hidden="true"
                  name="arrow-forward-outline"
                ></ion-icon>
                <span i18n>Move right</span>
              </button>
            </mat-menu>

            <mat-menu #resizeMenu="matMenu">
              <button
                data-testid="resize-wider"
                mat-menu-item
                type="button"
                (click)="resizeModule(item, 1, 0)"
              >
                <ion-icon aria-hidden="true" name="add-outline"></ion-icon>
                <span i18n>Wider</span>
              </button>
              <button
                data-testid="resize-narrower"
                mat-menu-item
                type="button"
                (click)="resizeModule(item, -1, 0)"
              >
                <ion-icon aria-hidden="true" name="remove-outline"></ion-icon>
                <span i18n>Narrower</span>
              </button>
              <button
                data-testid="resize-taller"
                mat-menu-item
                type="button"
                (click)="resizeModule(item, 0, 1)"
              >
                <ion-icon aria-hidden="true" name="add-outline"></ion-icon>
                <span i18n>Taller</span>
              </button>
              <button
                data-testid="resize-shorter"
                mat-menu-item
                type="button"
                (click)="resizeModule(item, 0, -1)"
              >
                <ion-icon aria-hidden="true" name="remove-outline"></ion-icon>
                <span i18n>Shorter</span>
              </button>
            </mat-menu>
          </div>

          <div class="dashboard-module__body">
            <ng-container
              *ngComponentOutlet="getModuleComponent(item.moduleKey)"
            ></ng-container>
          </div>
        </mat-card>
      </gridster-item>
    }
  </gridster>
</div>
